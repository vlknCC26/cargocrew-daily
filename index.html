<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The CargoCrew Daily</title>
<style>
  :root{
    --paper:#f7f4ee; --ink:#181614; --ink-2:#43403a; --ink-3:#807a70;
    --rule:#c9c2b4; --rule-dark:#181614;
    --red:#a4231b; --navy:#12304f; --gold:#a07c2c;
    --pos:#1e6b45; --neg:#a4231b;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:#e8e4da; color:var(--ink); font-family:Georgia, "Times New Roman", serif; font-size:15px; line-height:1.45;}
  .sheet{max-width:1100px; margin:0 auto; background:var(--paper); padding:26px 34px 40px; box-shadow:0 0 30px rgba(0,0,0,.18);}
  a{color:inherit; text-decoration:none;}
  a:hover .hl, a.hl:hover{color:var(--red);}
  .go{font-family:Arial, sans-serif; font-size:10.5px; font-weight:bold; letter-spacing:.5px; color:var(--red); text-transform:uppercase; white-space:nowrap;}
  a:hover .go{text-decoration:underline;}

  /* Masthead */
  .topline{display:flex; justify-content:space-between; font-family:Arial, sans-serif; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-2); border-bottom:1px solid var(--rule-dark); padding-bottom:6px;}
  .masthead{text-align:center; padding:16px 0 10px; border-bottom:4px double var(--rule-dark);}
  .masthead h1{font-size:56px; font-weight:900; letter-spacing:1px; line-height:1;}
  .masthead h1 .cc{color:var(--red);}
  .masthead .motto{font-style:italic; color:var(--ink-3); font-size:13px; margin-top:6px;}

  /* Archive bar */
  .archive-bar{display:flex; align-items:center; flex-wrap:wrap; gap:6px; padding:8px 0; border-bottom:1px solid var(--rule-dark); font-family:Arial, sans-serif;}
  .archive-bar .lbl{font-size:10.5px; font-weight:bold; letter-spacing:2px; text-transform:uppercase; color:var(--ink-2); margin-right:6px;}
  .ed-link{font-family:Arial, sans-serif; font-size:11.5px; font-weight:bold; background:none; border:1px solid var(--rule); color:var(--ink-2); padding:4px 12px; cursor:pointer; border-radius:2px;}
  .ed-link:hover{border-color:var(--red); color:var(--red);}
  .ed-link.active{background:var(--rule-dark); color:var(--paper); border-color:var(--rule-dark);}
  .ed-link .today{color:var(--gold);}
  .edition{display:none;}
  .edition.show{display:block;}

  /* Live Wire */
  .wire{border-bottom:1px solid var(--rule-dark); padding:10px 0 14px;}
  .wire-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:8px;}
  .refresh-btn{font-family:Arial, sans-serif; font-size:12px; font-weight:900; letter-spacing:1.5px; text-transform:uppercase; background:var(--red); color:#fff; border:none; padding:9px 18px; cursor:pointer; border-radius:2px;}
  .refresh-btn:hover{background:#7d1b15;}
  .refresh-btn:disabled{background:var(--ink-3); cursor:wait;}
  .wire-status{font-family:Arial, sans-serif; font-size:11.5px; color:var(--ink-3); font-style:italic;}
  .wire-cols{display:grid; grid-template-columns:1.6fr 1fr; gap:18px;}
  .wire-list{font-size:13px; max-height:340px; overflow-y:auto; border:1px solid var(--rule); background:#fbf9f4; padding:8px 12px;}
  .wire-item{padding:6px 0; border-bottom:1px dotted var(--rule);}
  .wire-item:last-child{border-bottom:none;}
  .wire-item .src-tag{font-family:Arial, sans-serif; font-size:9.5px; font-weight:bold; letter-spacing:1px; text-transform:uppercase; color:var(--navy); background:#e4ded0; padding:1px 6px; border-radius:2px; margin-right:6px;}
  .wire-item .wt{font-family:Arial, sans-serif; font-size:10px; color:var(--ink-3); margin-left:6px; white-space:nowrap;}
  .wire-item a{font-weight:700;}
  .wire-item a:hover{color:var(--red);}
  .wire-log{font-family:"Courier New", monospace; font-size:11px; background:#1d1a17; color:#cfead6; padding:10px 12px; max-height:340px; overflow-y:auto; border-radius:2px; line-height:1.5;}
  .wire-log .err{color:#f0b0a8;}
  .wire-log .ok{color:#a8e6bc;}
  @media (max-width:820px){ .wire-cols{display:block;} .wire-log{margin-top:10px;} }

  /* Ticker */
  .ticker{display:flex; flex-wrap:wrap; border-bottom:1px solid var(--rule-dark); font-family:Arial, sans-serif;}
  .tick{flex:1 1 120px; padding:9px 10px; border-right:1px solid var(--rule); text-align:center;}
  .tick:last-child{border-right:none;}
  .tick .l{font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-3);}
  .tick .v{font-size:17px; font-weight:bold; margin-top:1px;}
  .tick .d{font-size:10.5px; font-weight:bold;}
  .up{color:var(--pos);} .down{color:var(--neg);}

  /* Sections & headlines */
  .kicker{font-family:Arial, sans-serif; font-size:10.5px; font-weight:bold; letter-spacing:1.6px; text-transform:uppercase; color:var(--red); margin-bottom:4px;}
  .kicker.navy{color:var(--navy);}
  h2.head{font-weight:900; line-height:1.08; margin-bottom:6px;}
  .dek{color:var(--ink-2); font-size:14px;}
  .why{font-family:Arial, sans-serif; font-size:11.5px; color:var(--navy); background:#eae5d8; padding:5px 8px; margin-top:8px; border-left:3px solid var(--gold);}
  .why b{color:var(--red);}

  /* Layout */
  .lead-zone{display:grid; grid-template-columns:1.9fr 1fr; gap:0; border-bottom:4px double var(--rule-dark);}
  .lead{padding:18px 22px 18px 0; border-right:1px solid var(--rule);}
  .lead h2{font-size:40px;}
  .lead .dek{font-size:16px; margin-top:8px;}
  .sidebar{padding:18px 0 18px 20px;}
  .side-item{border-bottom:1px solid var(--rule); padding:9px 0;}
  .side-item:last-child{border-bottom:none;}
  .side-item h3{font-size:16px; font-weight:900; line-height:1.15;}
  .side-item p{font-size:12.5px; color:var(--ink-2); margin-top:3px;}

  .band{border-bottom:1px solid var(--rule-dark); padding:16px 0;}
  .band-title{font-family:Arial, sans-serif; font-size:13px; font-weight:900; letter-spacing:2.5px; text-transform:uppercase; border-top:4px solid var(--rule-dark); border-bottom:1px solid var(--rule-dark); padding:5px 0 4px; margin-bottom:14px; display:flex; justify-content:space-between;}
  .band-title .sub{font-weight:normal; letter-spacing:.5px; color:var(--ink-3); text-transform:none; font-style:italic; font-family:Georgia, serif; font-size:12px;}
  .cols3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:0;}
  .cols2{display:grid; grid-template-columns:1fr 1fr; gap:0;}
  .col{padding:0 18px; border-right:1px solid var(--rule);}
  .col:first-child{padding-left:0;}
  .col:last-child{border-right:none; padding-right:0;}
  .story{margin-bottom:16px;}
  .story h2{font-size:19px;}
  .story .dek{font-size:13px; margin-top:3px;}
  .brief-list .story{margin-bottom:12px; padding-bottom:10px; border-bottom:1px dotted var(--rule);}
  .brief-list .story:last-child{border-bottom:none;}
  .brief-list h2{font-size:15.5px;}

  /* Numbers box */
  .numbox{background:#efe9dc; border:1px solid var(--rule); padding:12px 14px; font-family:Arial, sans-serif;}
  .numbox h4{font-size:11px; letter-spacing:1.5px; text-transform:uppercase; border-bottom:1px solid var(--rule-dark); padding-bottom:4px; margin-bottom:8px;}
  .numrow{display:flex; justify-content:space-between; font-size:12.5px; padding:3px 0; border-bottom:1px dotted var(--rule);}
  .numrow:last-child{border-bottom:none;}
  .numrow .n{font-weight:bold;}

  /* GSA Radar */
  .radar-table{width:100%; border-collapse:collapse; font-family:Arial, sans-serif; font-size:12px;}
  .radar-table th{text-align:left; font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-2); border-bottom:2px solid var(--rule-dark); padding:4px 6px 4px 0;}
  .radar-table td{padding:7px 6px 7px 0; border-bottom:1px dotted var(--rule); vertical-align:top;}
  .radar-table td.car{font-family:Georgia, serif; font-weight:900; font-size:13.5px; white-space:nowrap;}
  .radar-table .stars{min-width:0; font-size:12px;}
  .radar-gone{color:var(--ink-3); text-decoration:line-through;}
  .signed{padding:8px 0; border-bottom:1px dotted var(--rule); font-size:13px;}
  .signed:last-child{border-bottom:none;}
  .signed .d8{font-family:Arial, sans-serif; font-size:10.5px; font-weight:bold; color:var(--ink-3); letter-spacing:1px; text-transform:uppercase; margin-right:6px;}
  .signed b{font-family:Georgia, serif; font-weight:900;}

  /* Opportunities & risks */
  .opp-row{display:flex; gap:12px; align-items:baseline; padding:9px 0; border-bottom:1px dotted var(--rule);}
  .opp-row:last-child{border-bottom:none;}
  .stars{font-family:Arial, sans-serif; color:var(--gold); font-size:14px; white-space:nowrap; min-width:78px;}
  .opp-row h3{font-size:15.5px; font-weight:900; display:inline;}
  .opp-row p{display:inline; font-size:13px; color:var(--ink-2);}
  .risk-num{font-family:Arial, sans-serif; font-weight:900; font-size:20px; color:var(--red); min-width:26px;}

  /* Actions */
  .actions{columns:2; column-gap:34px; column-rule:1px solid var(--rule);}
  .act{break-inside:avoid; padding:6px 0 6px 0; font-size:13.5px; border-bottom:1px dotted var(--rule);}
  .act b{font-family:Arial, sans-serif; font-size:12px; text-transform:uppercase; letter-spacing:.5px;}
  .act .n{color:var(--red); font-weight:900; font-family:Georgia, serif; font-size:16px; margin-right:6px;}

  .foot{font-size:11px; color:var(--ink-3); font-style:italic; padding-top:12px; text-align:center;}
  .tagv{font-family:Arial, sans-serif; font-size:9px; font-weight:bold; color:#fff; background:var(--gold); padding:1px 5px; letter-spacing:1px; vertical-align:middle;}

  @media (max-width:820px){
    .lead-zone,.cols3,.cols2{display:block;}
    .lead{border-right:none; padding-right:0;}
    .col{border-right:none; padding:0;}
    .actions{columns:1;}
    .masthead h1{font-size:34px;}
    .lead h2{font-size:28px;}
  }
</style>
</head>
<body>
<div class="sheet">

  <div class="masthead">
    <h1>THE <span class="cc">CARGOCREW</span> DAILY</h1>
    <div class="motto">"Opportunities before competitors do." — every story links to its source, tap any headline</div>
  </div>

    <div class="archive-bar">
    <span class="lbl">Editions ▸</span>
    <span id="edNav"></span>
  </div>

<!-- LIVE WIRE (global — do not remove when adding editions) -->
  <div class="wire">
    <div class="wire-head">
      <span style="font-family:Arial, sans-serif; font-size:11px; font-weight:900; letter-spacing:1.8px; text-transform:uppercase; background:var(--red); color:#fff; padding:5px 12px; border-radius:2px;">● Live Wire — Auto-Updates Hourly</span>
      <span class="wire-status" id="wireStatus">Loading the latest trade-press headlines…</span>
    </div>
    <div class="wire-list" id="wireList" style="max-height:280px;"><span style="color:var(--ink-3); font-style:italic;">Loading the latest headlines…</span></div>
  </div>

    <div id="editions"><div style="padding:30px 0; color:var(--ink-3); font-style:italic;">Loading today's edition…</div></div>

<script>
(function(){
  var nav = document.getElementById('edNav');
  var container = document.getElementById('editions');
  var current = null;
  function loadEdition(id, btn){
    fetch('ed-'+id+'.html?t='+Date.now()).then(function(r){return r.text();}).then(function(h){
      container.innerHTML = h;
      Array.prototype.forEach.call(nav.children, function(b){ b.classList.toggle('active', b===btn); });
      current = id;
      window.scrollTo(0,0);
    });
  }
  fetch('manifest.json?t='+Date.now()).then(function(r){return r.json();}).then(function(m){
    m.forEach(function(ed, i){
      var b = document.createElement('button');
      b.className = 'ed-link'; b.textContent = ed.label;
      b.addEventListener('click', function(){ loadEdition(ed.id, b); });
      nav.appendChild(b);
      if(i===0) loadEdition(ed.id, b);
    });
  }).catch(function(){ container.innerHTML = '<p style="padding:30px 0;">Could not load editions manifest.</p>'; });
})();

/* ===== Live Wire refresh ===== */
(function(){
  var FEEDS = [
    {name:'Air Cargo News', url:'https://www.aircargonews.net/feed/'},
    {name:'The Loadstar',   url:'https://theloadstar.com/feed/'},
    {name:'Air Cargo Week', url:'https://aircargoweek.com/feed/'},
    {name:'STAT Times',     url:'https://www.stattimes.com/rss/latest-news'}
  ];
  var list = document.getElementById('wireList');
  var status = document.getElementById('wireStatus');
  if(!list) return;
  var busy = false;

  function ts(){ var d=new Date(); return [d.getHours(),d.getMinutes(),d.getSeconds()].map(function(n){return (n<10?'0':'')+n;}).join(':'); }
  function log(msg, cls){ try{ console.log('[wire '+ts()+'] '+msg); }catch(e){} }
  function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

  function parseFeed(xmlText, srcName){
    var doc = new DOMParser().parseFromString(xmlText, 'text/xml');
    if(doc.querySelector('parsererror')) throw new Error('feed not parseable');
    var items = [];
    var nodes = doc.querySelectorAll('item');
    if(!nodes.length) nodes = doc.querySelectorAll('entry'); // Atom fallback
    nodes.forEach(function(it){
      var title = (it.querySelector('title')||{}).textContent || '';
      var linkEl = it.querySelector('link');
      var link = linkEl ? (linkEl.textContent || linkEl.getAttribute('href') || '') : '';
      var dateStr = (it.querySelector('pubDate')||it.querySelector('published')||it.querySelector('updated')||{}).textContent || '';
      var d = dateStr ? new Date(dateStr) : null;
      if(title && link) items.push({title:title.trim(), link:link.trim(), date:(d && !isNaN(d))?d:null, src:srcName});
    });
    return items;
  }

  function fetchFeed(f){
    var attempts = [
      {label:'direct', url:f.url},
      {label:'proxy1', url:'https://api.allorigins.win/raw?url='+encodeURIComponent(f.url)},
      {label:'proxy2', url:'https://corsproxy.io/?url='+encodeURIComponent(f.url)},
      {label:'proxy3', url:'https://api.codetabs.com/v1/proxy?quest='+encodeURIComponent(f.url)}
    ];
    function tryNext(i){
      if(i >= attempts.length){ log(f.name+': all fetch routes failed.', 'err'); return Promise.resolve([]); }
      var a = attempts[i];
      return fetch(a.url, {mode:'cors'}).then(function(r){
        if(!r.ok) throw new Error('HTTP '+r.status);
        return r.text();
      }).then(function(t){
        var items = parseFeed(t, f.name);
        log(f.name+' ('+a.label+'): '+items.length+' headlines fetched.', 'ok');
        return items;
      }).catch(function(e){
        log(f.name+' ('+a.label+') failed: '+(e && e.message ? e.message : 'blocked'), 'err');
        return tryNext(i+1);
      });
    }
    return tryNext(0);
  }

  function render(items){
    if(!items.length){
      list.innerHTML = '<span style="color:var(--ink-3); font-style:italic;">No headlines retrieved. If you are viewing this inside the Claude panel, its sandbox may block live fetches — download the file and open it in your browser, or ask Claude for a fresh edition.</span>';
      return;
    }
    items.sort(function(a,b){ return (b.date?b.date.getTime():0) - (a.date?a.date.getTime():0); });
    var top = items.slice(0, 25);
    list.innerHTML = top.map(function(it){
      var when = it.date ? it.date.toLocaleString(undefined,{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : '';
      return '<div class="wire-item"><span class="src-tag">'+esc(it.src)+'</span><a href="'+esc(it.link)+'" target="_blank">'+esc(it.title)+'</a><span class="wt">'+esc(when)+'</span></div>';
    }).join('');
  }

  function refresh(trigger){
    if(busy) return;
    busy = true;
    status.textContent = 'Refreshing…';
    log('Auto-refresh started ('+trigger+')');
    // Preferred source: headlines.json rebuilt hourly by GitHub Actions on the same site (no CORS, always fresh)
    fetch('headlines.json?t='+Date.now()).then(function(r){ if(!r.ok) throw new Error('no baked headlines'); return r.json(); }).then(function(j){
      var items = (j.items||[]).map(function(it){ return {title:it.title, link:it.link, date:it.date?new Date(it.date):null, src:it.src}; });
      render(items);
      status.textContent = 'Headlines updated hourly on this site — last build '+(j.generated||'')+' UTC. Analysed editions below are updated each morning. Today: '+new Date().toDateString()+'.';
      busy = false;
    }).catch(function(){
    Promise.all(FEEDS.map(fetchFeed)).then(function(results){
      var all = [];
      results.forEach(function(r){ all = all.concat(r); });
      render(all);
      var newest = all.filter(function(i){return i.date;}).sort(function(a,b){return b.date-a.date;})[0];
      log('Refresh complete: '+all.length+' headlines from '+results.filter(function(r){return r.length;}).length+'/'+FEEDS.length+' sources.'+(newest?(' Newest: "'+newest.title.slice(0,60)+'…"'):''), all.length?'ok':'err');
      status.textContent = all.length
        ? ('Last updated '+ts()+' — '+all.length+' headlines. Auto-refreshes every hour while this page is open; the analysed edition below updates each morning.')
        : ('Last attempt '+ts()+' — feeds not reachable from this viewer. In a normal browser this page updates itself hourly.');
      busy = false;
    });
    });
  }

  refresh('page opened');                      // fetch immediately on open
  setInterval(function(){ refresh('hourly timer'); }, 60*60*1000);  // then every hour
})();
</script>

</div>
</body>
</html>
